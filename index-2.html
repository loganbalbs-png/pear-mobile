<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111">
<title>Pear Phone</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#111;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
body{display:grid;place-items:center}
.phone-stage{position:relative;width:100vw;height:100vh;display:grid;place-items:center;background:#111;overflow:hidden}
.reference-phone{
  width:min(92vw,430px);
  height:auto;
  max-height:96vh;
  object-fit:contain;
  display:block;
  image-rendering:auto;
  user-select:none;
  -webkit-user-drag:none;
}
.hotspots{position:absolute;inset:0;pointer-events:none}
.hotspot{
  position:absolute;
  border:0;background:transparent;padding:0;margin:0;
  pointer-events:auto;cursor:pointer;
  border-radius:50%;
}
.hotspot:focus{outline:0}
.app-page{
  position:absolute;inset:0;background:#173b4d;color:#fff;
  z-index:50;display:flex;flex-direction:column
}
.hidden{display:none}
.header{
  height:48px;display:flex;align-items:center;justify-content:space-between;
  padding:0 10px;border-bottom:1px solid #31596a;font-weight:700;font-size:13px
}
.header button{width:29px;height:29px;border-radius:50%;border:1px solid #4c7180;background:#21495c;color:#fff;font-size:15px}
.content{padding:14px;overflow:auto;font-size:12px}
.panel{background:#1d495c;border:1px solid #416a79;border-radius:7px;padding:11px;margin-bottom:9px}
.row{padding:9px 0;border-bottom:1px solid #3c6070}.row:last-child{border-bottom:0}
</style>
</head>
<body>
<div class="phone-stage">

  <!-- This is the user's supplied reference, cropped to the front Pear Phone. -->
  <img class="reference-phone" src="pear-phone-reference-front.png" alt="Pear Phone reference">

  <!-- Transparent tap targets positioned over the real icons in the reference image. -->
  <div class="hotspots" id="hotspots"></div>

  <section class="app-page hidden" id="appPage">
    <div class="header">
      <button onclick="goHome()">←</button>
      <span id="title">Pear App</span>
      <button onclick="goHome()">⌂</button>
    </div>
    <div class="content" id="content"></div>
  </section>
</div>

<script>
const apps = [
  ["Mail","mail"],["Phone","phone"],["Contacts","contacts"],["Messages","messages"],
  ["Camera","camera"],["Photos","photos"],["Music","music"],["Videos","videos"],
  ["Internet","internet"],["Maps","maps"],["Weather","weather"],["Calendar","calendar"],
  ["Notes","notes"],["Clock","clock"],["Calculator","calculator"],["Settings","settings"],
  ["Games","games"],["Pear Store","store"]
];

/*
  The reference is approximately 151 x 214 px before scaling.
  These positions are proportional to the cropped front phone and are
  deliberately kept as simple invisible tap areas over the exact pictured icons.
*/
const targets = [
  [31,32,22,19,"mail"], [61,31,20,19,"phone"],
  [35,58,21,19,"contacts"], [64,57,21,19,"messages"],
  [34,82,20,18,"camera"], [64,81,20,18,"photos"],
  [34,105,20,18,"music"], [64,104,20,18,"videos"],
  [34,128,20,18,"internet"], [64,127,20,18,"maps"],
  [35,150,20,18,"weather"], [65,149,20,18,"calendar"],
  [34,172,20,18,"notes"], [64,171,20,18,"clock"],
  [82,95,20,18,"calculator"], [83,118,20,18,"settings"],
  [83,140,20,18,"games"], [82,163,20,18,"store"]
];

function placeHotspots(){
  const wrap=document.getElementById("hotspots");
  const img=document.querySelector(".reference-phone");
  const rect=img.getBoundingClientRect();
  // source crop dimensions before scaling
  const srcW=151, srcH=214;
  targets.forEach(([x,y,w,h,id])=>{
    const b=document.createElement("button");
    b.className="hotspot";
    b.setAttribute("aria-label",id);
    b.style.left=(rect.left+x/srcW*rect.width)+"px";
    b.style.top=(rect.top+y/srcH*rect.height)+"px";
    b.style.width=(w/srcW*rect.width)+"px";
    b.style.height=(h/srcH*rect.height)+"px";
    b.onclick=()=>openApp(id);
    wrap.appendChild(b);
  });
}
window.addEventListener("load",placeHotspots);
window.addEventListener("resize",()=>{document.getElementById("hotspots").innerHTML="";placeHotspots()});

const page=document.getElementById("appPage");
const title=document.getElementById("title");
const content=document.getElementById("content");

function goHome(){page.classList.add("hidden")}

function openApp(id){
  const names=Object.fromEntries(apps);
  title.textContent=names[id] || "Pear App";
  content.innerHTML=screen(id);
  page.classList.remove("hidden");
}

function screen(id){
  const common={
    mail:`<div class="panel"><h2>Mail</h2><div class="row">Welcome to Pear Phone</div><div class="row">No new mail</div></div>`,
    phone:`<div class="panel"><h2>Phone</h2><div class="row">Carly</div><div class="row">Sam</div><div class="row">Freddie</div></div>`,
    contacts:`<div class="panel"><h2>Contacts</h2><div class="row">Carly</div><div class="row">Sam</div><div class="row">Freddie</div></div>`,
    messages:`<div class="panel"><h2>Messages</h2><div class="row"><b>Sam</b><br>where are you?</div><div class="row"><b>Carly</b><br>call me</div></div>`,
    camera:`<div class="panel" style="height:330px;display:grid;place-items:center;font-size:44px">●</div>`,
    photos:`<div class="panel"><h2>Photos</h2><div class="row">Camera Roll</div><div class="row">Favorites</div></div>`,
    music:`<div class="panel" style="text-align:center"><div style="font-size:70px">♪</div><h2>Now Playing</h2><p>Leave It All to Me</p></div>`,
    videos:`<div class="panel"><h2>Videos</h2><div class="row">My Videos</div></div>`,
    internet:`<div class="panel"><h2>Internet</h2><input value="www.pear.com" style="width:100%;padding:9px;background:#0d2d3c;color:#fff;border:1px solid #456d7d;border-radius:5px"><p>Welcome to Pear.</p></div>`,
    maps:`<div class="panel"><h2>Maps</h2><div style="height:340px;background:#619463;border-radius:5px"></div></div>`,
    weather:`<div class="panel" style="text-align:center"><div style="font-size:60px">☼</div><h1>24°</h1><p>Sunny</p></div>`,
    calendar:`<div class="panel"><h1>27</h1><p>Today</p><div class="row">No events</div></div>`,
    notes:`<div class="panel"><h2>Notes</h2><p>• call Spencer</p><p>• film new video</p><p>• get snacks</p></div>`,
    clock:`<div class="panel" style="text-align:center"><div style="font-size:60px">◷</div><h1 id="bigClock">9:41</h1></div>`,
    calculator:`<div class="panel"><h2>Calculator</h2><p>Calculator ready.</p></div>`,
    settings:`<div class="panel"><h2>Settings</h2><div class="row">Sound</div><div class="row">Wallpaper</div><div class="row">About Pear Phone</div></div>`,
    games:`<div class="panel"><h2>Games</h2><div class="row">Pear Snake</div><div class="row">Pear Match</div></div>`,
    store:`<div class="panel"><h2>Pear Store</h2><div class="row">Pear Chat — GET</div><div class="row">Pear Maps — GET</div></div>`
  };
  return common[id] || `<div class="panel"><h2>Pear App</h2><p>Ready.</p></div>`;
}
</script>
</body>
</html>
